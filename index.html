<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3EEE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Herramienta de consulta: lista → ficha → control. Colores y letras de la web de Javiera. */
:root{
  --bg:#F3EEE3; --card:#FFFDF8; --ink:#10241B; --green:#1F4D3A; --lime:#C8E25B; --papaya:#E8622C;
  --muted:#5B6A61; --line:#E2DACB; --soft:#EAF3C6; --warn:#FBE3D6; --ok:#DDEFD9;
  --display:Fraunces,Georgia,serif; --body:Manrope,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--papaya);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:450;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.7rem,4vw,2.3rem)}
h2{font-size:1.3rem}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:5;background:rgba(243,238,227,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.top .in{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:1.15rem;text-decoration:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:11px;height:11px;border-radius:50% 0;background:var(--green);transform:rotate(45deg)}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs a{text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 12px;border-radius:999px;white-space:nowrap}
.tabs a[aria-current]{background:var(--ink);color:var(--bg)}
@media (max-width:420px){.brand span{display:none}.tabs a{padding:8px 10px}}

main{max-width:1080px;margin:auto;padding:24px max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left));display:grid;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.card h2{margin-bottom:12px}

.btn{display:inline-flex;align-items:center;gap:6px;border:0;cursor:pointer;text-decoration:none;font-weight:700;font-size:.95rem;padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.danger{background:transparent;color:#B3261E;box-shadow:inset 0 0 0 1.5px #B3261E}
.btn.sm{padding:7px 12px;font-size:.85rem}
.btn[hidden]{display:none}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.list{list-style:none;display:grid;gap:8px}
.list a{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.list a:hover{border-color:var(--green)}
.list b{font-weight:700}
.list small{color:var(--muted)}
.list .r{text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:18px}

.banner{padding:12px 16px;border-radius:14px;background:var(--warn);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* formularios */
form{display:grid;gap:20px}
fieldset{border:0;display:grid;gap:12px}
legend{font-family:var(--display);font-size:1.2rem;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
label span.u{font-weight:400}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:16px;font-weight:500}
textarea{min-height:80px;resize:vertical}
.hint{font-size:.82rem;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.sticky{position:sticky;top:90px}
@media (max-width:820px){.split{grid-template-columns:1fr}.sticky{position:static}}

/* resultados */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile small{display:block;color:var(--muted);font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tile strong{display:block;font-family:var(--display);font-size:1.6rem;font-weight:450;margin:2px 0;font-variant-numeric:tabular-nums}
.tile em{font-style:normal;font-size:.8rem;font-weight:700}
.tile em.up{color:#9A3412}.tile em.down{color:#1F6B3A}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--soft)}
.chip.warn{background:var(--warn)}
.chip.err{background:#B3261E;color:#fff}
input.over{border-color:#B3261E;animation:shake .35s}
@keyframes shake{25%{translate:-4px}75%{translate:4px}}
@media (prefers-reduced-motion:reduce){input.over{animation:none}}
.res{display:grid;gap:8px}
.res div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.res div:last-child{border:0;padding:0}
.res dt{color:var(--muted)}
.res dd{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}

.chart svg{width:100%;height:auto;display:block}
.mealgrid th,.mealgrid td{white-space:normal;padding:8px 4px;text-align:center}
.mealgrid th:first-child,.mealgrid td:first-child{min-width:140px;text-align:left}
.mealgrid input{width:52px!important}
.suggest{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:14px;background:var(--soft);margin-bottom:16px}
.suggest p{flex:1 1 280px;font-size:.92rem}
.menu{font-weight:600;margin:6px 0 2px;padding:10px 14px;border-radius:12px;background:var(--soft)}
.report-extra{display:none}
@media print{body.with-report .report-extra{display:block;break-before:page}}
.pair{display:flex;gap:6px}
.pair input{flex:1;min-width:0}
.pair select{width:auto;flex:none;padding:11px 8px}
.alert{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--warn);font-size:.9rem}
.alerts{display:grid;gap:8px}
.alerts .alert{margin:0}
.alert.alta{background:#FBDAD5;border-left:4px solid #B3261E}
.alert.info{background:var(--soft);border-left:4px solid var(--green)}
.conds{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 16px}
.conds label.check{grid-column:auto;font-weight:500}
label.check{display:flex;gap:10px;align-items:center;grid-column:1/-1;font-size:.95rem;color:var(--ink)}
label.check input{width:22px;height:22px}
.meal ul{list-style:none;display:grid;gap:10px;margin-top:8px}
.meal li{display:grid;gap:2px;padding-left:14px;border-left:3px solid var(--lime)}
.meal li .muted{font-size:.9rem}
.bul{margin:8px 0 0 20px;display:grid;gap:4px}
.doc{display:grid;gap:22px}
.por{font-size:.85rem;color:var(--muted);margin-top:6px}
.eq{list-style:none;display:grid;gap:8px;margin-top:10px}
.eq li{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:4px 14px;padding-bottom:8px;border-bottom:1px solid var(--line);font-size:.9rem}
@media (max-width:560px){.eq li{grid-template-columns:1fr}}
.foot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.chart select{width:auto;margin-bottom:12px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));translate:-50% 0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;z-index:20;transition:opacity .3s}
.toast[hidden]{display:block;opacity:0;pointer-events:none}

/* informe para imprimir / guardar como PDF */
@media print{
  .top,.noprint,.toast{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
  main{padding:0;display:block}
  .card{border:0;padding:0;background:none}
  .doc{font-size:14px;line-height:1.4}
  .bul{gap:1px}
  .doc .meal h2,.doc .sec h2{font-size:1.15rem}
  /* en grid el navegador corta mal las páginas (títulos solos, textos encimados): al imprimir va en bloque */
  .doc{display:block}
  .doc>*+*{margin-top:18px}
  h1,h2,.eqhead{break-after:avoid}
  .eqhead{break-inside:avoid}
  .meal,.sec,.eq li,.bul li,tr,.foot{break-inside:avoid}
  .doc>*+*{margin-top:14px}
  .tablewrap{overflow:visible}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="#/" aria-label="Consulta, inicio"><i></i><span>Consulta</span></a>
  <nav class="tabs" aria-label="Secciones">
    <a href="#/" data-tab="p">Pacientes</a><a href="#/alimentos" data-tab="alimentos">Alimentos</a><a href="#/respaldo" data-tab="respaldo">Respaldo</a>
  </nav>
</div></header>
<main id="app"></main>
<div class="toast" id="toast" hidden role="status"></div>

<script>
// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// el teclado del iPhone en Chile escribe coma decimal
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : null; };
const fmt = (n, d = 1) => n == null || !Number.isFinite(n) ? '—' : n.toLocaleString('es-CL', { maximumFractionDigits: d, minimumFractionDigits: 0 });
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fdate = s => s ? new Date(s + 'T12:00').toLocaleDateString('es-CL', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 2200); }

// ---------- datos (solo en este equipo) ----------
const KEY = 'consulta-v1';
let db = load();
function load() {
  let d;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (!d || !Array.isArray(d.patients)) d = { patients: [], foods: [], lastBackup: null };
  return migrate(d);
}
function migrate(d) {
  // cada versión agrega alimentos y grupos nuevos sin pisar lo que Javiera ya editó
  if ((d.seed || 0) < 2) {
    const names = new Set(d.foods.map(f => f.name));
    d.foods.push(...FOODS_SEED().filter(f => !names.has(f.name)));
    d.groups ||= GROUPS_SEED();
    d.seed = 2;
  }
  if (d.seed < 3) { for (const g of d.groups) g.exBudget ??= BUDGET_EX()[g.id] || ''; d.seed = 3; }
  if (d.seed < 4) { // corrige el ejemplo de lípidos para que calce con los gramos del menú, si Javiera no lo editó
    const g = d.groups.find(x => x.id === 'lipidos');
    if (g?.ex.startsWith('⅓ palta mediana · 25 g')) g.ex = LIPIDOS_EX();
    if (g?.exBudget === '25 g de maní sin sal · ⅓ palta de temporada') g.exBudget = BUDGET_EX().lipidos;
    d.seed = 4;
  }
  return d;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch { alert('No se pudo guardar. El almacenamiento del equipo podría estar lleno: descarga un respaldo.'); return false; }
}
navigator.storage?.persist?.();
const patient = id => db.patients.find(p => p.id === id);
const sorted = p => [...(p.controls || [])].sort((a, b) => a.date.localeCompare(b.date));

// ---------- cálculos ----------
const CIRC = [['brazoRel', 'Brazo relajado'], ['brazoCon', 'Brazo contraído'], ['cintura', 'Cintura'], ['cadera', 'Cadera'], ['muslo', 'Muslo medio'], ['pantorrilla', 'Pantorrilla']];
const FOLDS = [['triceps', 'Tríceps'], ['biceps', 'Bíceps'], ['subescapular', 'Subescapular'], ['cresta', 'Cresta ilíaca'], ['supraespinal', 'Supraespinal'], ['abdominal', 'Abdominal'], ['muslo', 'Muslo frontal'], ['pantorrilla', 'Pantorrilla medial']];
const SUM6 = ['triceps', 'subescapular', 'supraespinal', 'abdominal', 'muslo', 'pantorrilla']; // suma de 6 pliegues ISAK
const DW4 = ['biceps', 'triceps', 'subescapular', 'cresta'];
const ACTIVITY = [[1.2, 'Sedentaria'], [1.375, 'Ligera (1–3 días/sem)'], [1.55, 'Moderada (3–5 días/sem)'], [1.725, 'Alta (6–7 días/sem)'], [1.9, 'Muy alta (2 veces al día)']];
// Durnin & Womersley (1974): [edad desde, c, m] → densidad = c − m·log10(Σ4 pliegues)
const DW = {
  M: [[17, 1.1620, .0630], [20, 1.1631, .0632], [30, 1.1422, .0544], [40, 1.1620, .0700], [50, 1.1715, .0779]],
  F: [[16, 1.1549, .0678], [20, 1.1599, .0717], [30, 1.1423, .0632], [40, 1.1333, .0612], [50, 1.1339, .0645]]
};
function ageAt(birth, date) {
  if (!birth || !date) return null;
  const b = new Date(birth + 'T12:00'), d = new Date(date + 'T12:00');
  let a = d.getFullYear() - b.getFullYear();
  if (d.getMonth() < b.getMonth() || (d.getMonth() === b.getMonth() && d.getDate() < b.getDate())) a--;
  return a;
}
const sumOf = (f, keys) => keys.every(k => f?.[k] > 0) ? keys.reduce((s, k) => s + f[k], 0) : null;
const bmi = (w, h) => w && h ? w / (h / 100) ** 2 : null;
function bmiClass(b, a) {
  if (b == null || a == null || a < 18) return null; // en menores se usa IMC/edad (z-score), no estos cortes
  if (a >= 65) return b < 23 ? 'Bajo peso' : b < 28 ? 'Normal' : b < 32 ? 'Sobrepeso' : 'Obesidad'; // MINSAL adulto mayor
  return b < 18.5 ? 'Bajo peso' : b < 25 ? 'Normal' : b < 30 ? 'Sobrepeso' : b < 35 ? 'Obesidad I' : b < 40 ? 'Obesidad II' : 'Obesidad III'; // OMS
}
function fatPct(sex, a, f) {
  const s = sumOf(f, DW4);
  if (!s || a == null || !DW[sex]) return null;
  const [, c, m] = DW[sex].filter(r => a >= r[0]).pop() || DW[sex][0];
  return 495 / (c - m * Math.log10(s)) - 450; // Siri
}
const mifflin = (sex, w, h, a) => w && h && a != null ? 10 * w + 6.25 * h - 5 * a + (sex === 'M' ? 5 : -161) : null;
function results(p, c) {
  const a = ageAt(p.birth, c.date), f = c.folds || {}, ci = c.circ || {}, w = c.weight, h = c.height;
  const imc = bmi(w, h), fat = fatPct(p.sex, a, f), bmr = mifflin(p.sex, w, h, a);
  return {
    age: a, imc, imcClass: bmiClass(imc, a), fat,
    fatKg: fat != null && w ? w * fat / 100 : null, leanKg: fat != null && w ? w * (1 - fat / 100) : null,
    sum6: sumOf(f, SUM6), sum8: sumOf(f, FOLDS.map(x => x[0])),
    icc: ci.cintura && ci.cadera ? ci.cintura / ci.cadera : null,
    ict: ci.cintura && h ? ci.cintura / h : null,
    waistRisk: ci.cintura ? (ci.cintura >= (p.sex === 'M' ? 102 : 88) ? 'Riesgo alto' : ci.cintura >= (p.sex === 'M' ? 94 : 80) ? 'Riesgo aumentado' : 'Sin riesgo') : null,
    bmr, tdee: bmr && c.activity ? bmr * c.activity : null
  };
}
// autocomprobación de fórmulas (ver consola)
console.assert(Math.abs(fatPct('M', 25, { biceps: 10, triceps: 10, subescapular: 10, cresta: 10 }) - 16.2) < .1, 'Durnin-Womersley');
console.assert(Math.round(bmi(70, 175) * 10) === 229, 'IMC');
console.assert(ageAt('2000-06-15', '2026-06-14') === 25 && ageAt('2000-06-15', '2026-06-15') === 26, 'edad');
console.assert(Math.round(mifflin('F', 60, 165, 30)) === 1320, 'Mifflin');
console.assert(num('72,5') === 72.5, 'coma decimal');

// ---------- alimentos ----------
// Valores aproximados por 100 g (referencia USDA). Javiera puede editarlos según su tabla.
function FOODS_SEED() {
  return [
    ['Arroz blanco cocido', 130, 2.7, 28, .3], ['Fideos cocidos', 158, 5.8, 31, .9], ['Papa cocida', 87, 1.9, 20, .1],
    ['Pan blanco (marraqueta)', 270, 8.5, 56, 1.5], ['Pan integral', 247, 13, 41, 3.4], ['Avena', 389, 16.9, 66, 6.9],
    ['Lentejas cocidas', 116, 9, 20, .4], ['Porotos cocidos', 127, 8.7, 22.8, .5], ['Garbanzos cocidos', 164, 8.9, 27.4, 2.6],
    ['Pechuga de pollo cocida', 165, 31, 0, 3.6], ['Huevo entero', 143, 12.6, .7, 9.5], ['Vacuno magro cocido', 200, 29, 0, 9],
    ['Salmón cocido', 206, 22, 0, 12], ['Atún en agua', 116, 25.5, 0, .8], ['Leche descremada', 34, 3.4, 5, .1],
    ['Leche entera', 61, 3.2, 4.8, 3.3], ['Yogur natural', 61, 3.5, 4.7, 3.3], ['Quesillo', 110, 12, 3, 5],
    ['Queso gauda', 356, 25, 2.2, 27], ['Palta', 160, 2, 8.5, 14.7], ['Aceite de oliva', 884, 0, 0, 100],
    ['Almendras', 579, 21, 22, 50], ['Maní', 567, 26, 16, 49], ['Mantequilla de maní', 588, 25, 20, 50],
    ['Plátano', 89, 1.1, 23, .3], ['Manzana', 52, .3, 14, .2], ['Naranja', 47, .9, 12, .1], ['Frutillas', 32, .7, 7.7, .3],
    ['Tomate', 18, .9, 3.9, .2], ['Lechuga', 15, 1.4, 2.9, .2], ['Zanahoria', 41, .9, 9.6, .2], ['Brócoli', 34, 2.8, 6.6, .4],
    ['Azúcar', 387, 0, 100, 0],
    // panes, cereales y tubérculos
    ['Hallulla', 290, 8, 55, 4], ['Pan pita', 275, 9, 56, 1.2], ['Tortilla de trigo', 310, 8, 50, 8],
    ['Arroz integral cocido', 112, 2.3, 24, .8], ['Quinoa cocida', 120, 4.4, 21, 1.9], ['Fideos integrales cocidos', 149, 6, 30, 1.7],
    ['Choclo cocido', 96, 3.4, 21, 1.5], ['Camote cocido', 90, 2, 21, .2], ['Galletas de agua', 430, 9, 72, 11],
    ['Granola', 471, 10, 64, 20], ['Cereal de maíz (corn flakes)', 357, 7.5, 84, .4], ['Harina de trigo', 364, 10, 76, 1],
    ['Papas fritas caseras', 312, 3.4, 41, 15], ['Puré de papas', 83, 2, 17, 1],
    // legumbres
    ['Arvejas cocidas', 84, 5.4, 15.6, .2], ['Habas cocidas', 110, 7.6, 19.7, .4], ['Porotos negros cocidos', 132, 8.9, 23.7, .5],
    // carnes, pescados y huevos
    ['Trutro de pollo sin piel cocido', 209, 26, 0, 10.9], ['Pechuga de pavo cocida', 135, 30, 0, 1], ['Carne molida 10 % grasa cocida', 217, 26, 0, 12],
    ['Lomo vetado cocido', 290, 24, 0, 21], ['Posta negra cocida', 190, 30, 0, 7], ['Lomo de cerdo cocido', 200, 27, 0, 9],
    ['Jamón de pavo', 104, 17, 2, 3], ['Jamón de cerdo', 145, 21, 1.5, 6], ['Vienesa', 290, 11, 3, 26],
    ['Merluza cocida', 90, 19, 0, 1.3], ['Jurel en lata', 170, 21, 0, 9], ['Sardinas en aceite', 208, 24.6, 0, 11.5],

// alertas clínicas del paciente; si se pasa una pauta, también revisa su menú contra las alergias
function alertsFor(p, plan) {
  const c = p.cond || {}, age = ageAt(p.birth, today()), out = [];
  if (age != null && age < 18) out.push(['alta', 'Menor de 18 años: evalúa con curvas IMC/edad de la OMS y requerimientos pediátricos. La sugerencia no aplica déficit.']);
  if (age >= 65) out.push(['info', 'Adulto mayor: IMC con cortes MINSAL. Cuida la proteína (mínimo 1,0 a 1,2 g/kg) y evita déficits agresivos.']);
  if (c.embarazo) out.push(['alta', 'Embarazo: sin déficit calórico. Suma energía según trimestre (aprox. +340 kcal en el 2º y +450 kcal en el 3º, con «kcal fijas») y evalúa con la curva de incremento de peso gestacional, no con el IMC.']);
  if (c.lactancia) out.push(['alta', 'Lactancia: suma alrededor de 400 a 500 kcal al día (con «kcal fijas») y evita déficits marcados.']);
  if (c.diabetes) out.push(['alta', 'Diabetes: reparte los carbohidratos parejo en el día, prefiere integrales y legumbres, sin azúcares añadidos. Coordina con su tratamiento médico.']);
  if (c.hipertension) out.push(['info', 'Hipertensión: menos de 5 g de sal al día (OMS). Evitar embutidos, snacks salados y sopas en sobre.']);
  if (c.renal) out.push(['alta', 'Enfermedad renal: proteína, potasio y fósforo dependen de la etapa. La sugerencia usa 0,8 g/kg de proteína; ajústala según el nefrólogo.']);
  if (c.celiaquia) out.push(['info', 'Celiaquía: el menú sugerido usa alimentos sin gluten. Revisar siempre el sello «sin gluten».']);
  if (c.lactosa) out.push(['info', 'Intolerancia a la lactosa: el menú sugerido usa lácteos sin lactosa.']);
  if (c.vegano) out.push(['info', 'Vegano: el menú usa tofu, legumbres y bebidas vegetales fortificadas. Indicar suplemento de vitamina B12.']);
  else if (c.vegetariano) out.push(['info', 'Vegetariano: el menú cambia las carnes por huevo, legumbres y tofu. Vigilar hierro y B12.']);
  if (p.allergies?.trim()) out.push(['alta', `Alergias o intolerancias: ${esc(p.allergies.trim())}.`]);
  if (plan) {
    const text = norm(Object.values(plan.menu || {}).join(' ') + ' ' + (plan.prefer || ''));
    for (const a of allergyList(p)) {
      const words = Object.entries(ALLERGY_WORDS).find(([k]) => a.includes(k) || k.includes(a))?.[1] || [a];
      const hit = words.find(w => w.length > 2 && text.includes(w));
      if (hit) out.push(['alta', `⚠ La pauta menciona «${hit}» y el paciente tiene alergia a ${esc(a)}. Revísala.`]);
    }
  }
  return out;
}

// objetivo sugerido según IMC, corregido por condiciones donde un déficit no corresponde
function goalFor(p, cls) {
  const c = p.cond || {}, age = ageAt(p.birth, today());
  let adj = SUGGEST_ADJUST[cls];
  if (age != null && age < 18) return 0;
  if (adj == null) return null;

const half = x => Math.max(0, Math.round(x * 2) / 2);
function suggestPortions(t) {
  const P = { verdurasG: 2, verdurasL: 2, frutas: t.kcal < 1600 ? 2 : 3, lacteosBG: t.kcal > 2400 ? 3 : 2, carnesAG: 1 };
  const sum = k => db.groups.reduce((s, g) => s + (P[g.id] || 0) * g[k], 0);
  const g = id => db.groups.find(x => x.id === id);
  P.cereales = Math.max(1, half((t.C - sum('c')) / g('cereales').c));
  P.carnesBG = Math.max(1, half((t.P - sum('p')) / g('carnesBG').p));
  P.lipidos = Math.min(2, Math.floor((t.G - sum('g')) / g('lipidos').g));
  P.aceites = half((t.G - sum('g')) / g('aceites').g);
  P.cereales = Math.max(1, P.cereales + half((t.kcal - sum('kcal')) / g('cereales').kcal)); // ajuste fino de calorías con cereales

// reparte n porciones según pesos, en pasos de 1 (o de 0,5 si n tiene media porción), por mayor resto
function allocate(n, weights) {
  const step = Number.isInteger(n) ? 1 : .5, units = Math.round(n / step), keys = Object.keys(weights);
  const W = keys.reduce((s, k) => s + weights[k], 0), raw = keys.map(k => units * weights[k] / W), out = raw.map(Math.floor);
  let left = units - out.reduce((a, b) => a + b, 0);
  raw.map((r, i) => [r - out[i], i]).sort((a, b) => b[0] - a[0]).slice(0, left).forEach(([, i]) => out[i]++);
  return Object.fromEntries(keys.map((k, i) => [k, out[i] * step]).filter(([, v]) => v > 0));
}
function fq(x) {

  const fr = [[1 / 3, '⅓'], [2 / 3, '⅔']].find(([v]) => Math.abs(f - v) < .02);
  if (fr) return (w || '') + fr[1];
  const q = Math.round(x * 4) / 4, qw = Math.floor(q), qf = q - qw; // medidas caseras: al cuarto más cercano
  return qf ? (qw || '') + { .25: '¼', .5: '½', .75: '¾' }[qf] : String(qw);

const round5 = x => x < 20 ? Math.round(x) : Math.round(x / 5) * 5;

function buildMenu(plan, p) {

      const it = items[gid]; if (!it) return '';
      const v = it[CTX[m]] || it.pan || it.plato || it.col, [q, s, pl, g, name, u = 'g'] = plan.budget && v.b ? v.b : v.r, x = q * n;
      const casera = `${fq(x)} ${x <= 1 ? s : pl}`;
      if (s.startsWith('g de')) return `${round5(x)} ${s}`; // ya está en gramos
      if (units === 'gramos') return `${round5(g * n)} ${u} de ${name}`;
      return units === 'caseras' ? casera : `${casera} (${round5(g * n)} ${u})`;

function tips(adjust, budget, p) {

    : adjust > 0

      : { prefer: 'Comer a horarios regulares\nVerduras en almuerzo y cena', avoid: 'Bebidas azucaradas\nFrituras' };

function suggestPlan(p, plan, budget) {

// ---------- gráfico de evolución (SVG) ----------
const METRICS = {
  weight: ['Peso', 'kg', (p, c) => c.weight], imc: ['IMC', 'kg/m²', (p, c) => results(p, c).imc],
  fat: ['% grasa', '%', (p, c) => results(p, c).fat], cintura: ['Cintura', 'cm', (p, c) => c.circ?.cintura],
  sum6: ['Σ 6 pliegues', 'mm', (p, c) => results(p, c).sum6], brazoCon: ['Brazo contraído', 'cm', (p, c) => c.circ?.brazoCon]
};
function chart(p, key) {
  const [label, unit, get] = METRICS[key];
  const pts = sorted(p).map(c => ({ t: new Date(c.date + 'T12:00').getTime(), y: get(p, c), d: c.date })).filter(x => x.y != null);
  if (pts.length < 2) return `<p class="muted">Se necesitan al menos 2 controles con ${label.toLowerCase()} para ver la evolución.</p>`;
  const W = 640, H = 230, L = 46, R = 16, T = 18, B = 34;
  const ys = pts.map(x => x.y), lo = Math.min(...ys), hi = Math.max(...ys), pad = (hi - lo) * .15 || 1;
  const y0 = lo - pad, y1 = hi + pad, t0 = pts[0].t, t1 = pts.at(-1).t || t0 + 1;
  const X = t => L + (t - t0) / ((t1 - t0) || 1) * (W - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  const ticks = [y0 + pad, (lo + hi) / 2, y1 - pad];
  const line = pts.map(x => `${X(x.t).toFixed(1)},${Y(x.y).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label} en el tiempo">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E2DACB"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#5B6A61">${fmt(v)}</text>`).join('')}
    <polygon points="${X(t0)},${H - B} ${line} ${X(pts.at(-1).t)},${H - B}" fill="#C8E25B" opacity=".25"/>
    <polyline points="${line}" fill="none" stroke="#1F4D3A" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((x, i) => `<circle cx="${X(x.t)}" cy="${Y(x.y)}" r="${i === pts.length - 1 ? 6 : 4}" fill="${i === pts.length - 1 ? '#E8622C' : '#1F4D3A'}" stroke="#fff" stroke-width="2"><title>${fdate(x.d)}: ${fmt(x.y)} ${unit}</title></circle>`).join('')}
    <text x="${X(pts.at(-1).t)}" y="${Y(pts.at(-1).y) - 12}" text-anchor="end" font-size="13" font-weight="700" fill="#10241B">${fmt(pts.at(-1).y)} ${unit}</text>
    <text x="${L}" y="${H - 10}" font-size="11" fill="#5B6A61">${fdate(pts[0].d)}</text>
    <text x="${W - R}" y="${H - 10}" font-size="11" fill="#5B6A61" text-anchor="end">${fdate(pts.at(-1).d)}</text>
  </svg>`;
}

function tile(label, val, unit, prev, extra = '', lowerIsBetter = true, d = 1) {
  let delta = '';
  if (val != null && prev != null && Math.abs(val - prev) >= .05) {
    const diff = val - prev, good = lowerIsBetter ? diff < 0 : diff > 0;
    delta = `<em class="${good ? 'down' : 'up'}">${diff > 0 ? '▲' : '▼'} ${fmt(Math.abs(diff), d)} ${unit}</em>`;
  }
  return `<div class="tile"><small>${label}</small><strong>${fmt(val, d)}${val != null && unit ? ` <span style="font-size:.55em">${unit}</span>` : ''}</strong>${delta} ${extra}</div>`;
}

function readPlan(form, base) {
  const plan = { ...base, portions: {}, meals: {}, menu: {} };
  for (const [k, v] of new FormData(form)) {
    const [a, b, c] = k.split('.');
    if (a === 'portions') { const n = num(v); if (n) plan.portions[b] = n; }
    else if (a === 'menu') { if (v.trim()) plan.menu[b] = v.trim(); }
    else if (a === 'meals') { const n = num(v); if (n) (plan.meals[b] ||= {})[c] = n; }
    else if (['date', 'prefer', 'avoid', 'activity', 'notes', 'protUnit', 'fatUnit', 'units'].includes(a)) plan[a] = v;
    else if (a !== 'showKcal' && a !== 'budget') plan[a] = num(v);
  }
  plan.showKcal = form.elements.showKcal.checked;
  plan.budget = form.elements.budget.checked;
  return plan;
}

function targetsHtml(p, plan) {
  const t = targets(p, plan);
  if (!t.kcal) return '<p class="muted">Registra un control con peso y talla (y la fecha de nacimiento del paciente) para calcular el gasto, o escribe las kcal fijas.</p>';
  const pk = x => t.w && x != null ? ` · ${fmt(x / t.w)} g/kg` : '';
  const pct = (g, k) => g != null ? fmt(g * k / t.kcal * 100, 0) + ' %' : '';
  const warn = [];
  if (plan.protKg && plan.protUnit !== 'g' && !t.w) warn.push('Para usar g/kg falta un control con peso. Regístralo o cambia la unidad a g/día.');
  if (plan.protUnit !== 'g' && plan.protKg > 4) warn.push(`${fmt(plan.protKg)} g/kg de proteínas es muy alto. ¿Querías poner gramos al día? Cambia la unidad a g/día.`);
  if (plan.fatUnit !== 'g' && plan.fatPct > 60) warn.push(`${fmt(plan.fatPct)} % de grasas no es posible en una pauta normal. ¿Querías poner gramos al día? Cambia la unidad a g/día.`);
  if (t.C != null && t.C < 0) warn.push('Proteínas y grasas superan la meta de calorías: baja alguna.');
  return `<div class="tiles">
    <div class="tile"><small>Meta diaria</small><strong>${fmt(t.kcal, 0)}</strong><em>kcal${t.tdee && !plan.kcalManual ? ' · gasto ' + fmt(t.tdee, 0) : ''}</em></div>
    <div class="tile"><small>Proteínas</small><strong>${fmt(t.P, 0)} g</strong><em>${pct(t.P, 4)}${pk(t.P)}</em></div>
    <div class="tile"><small>Grasas</small><strong>${fmt(t.G, 0)} g</strong><em>${pct(t.G, 9)}${pk(t.G)}</em></div>
    <div class="tile"><small>Carbohidratos</small><strong>${fmt(t.C, 0)} g</strong><em>${pct(t.C, 4)}${pk(t.C)}</em></div>
  </div>${warn.map(m => `<p class="alert">${m}</p>`).join('')}`;
}

function totalsHtml(p, plan) {
  const t = targets(p, plan), s = totals(plan.portions);
  const tile = (label, a, goal, u) => {
    const q = goal > 0 ? Math.round(a / goal * 100) : null, ok = q != null && q >= 90 && q <= 110;
    return `<div class="tile"><small>${label}</small><strong>${fmt(a, 0)} ${u}</strong>${q != null ? `<span class="chip ${ok ? '' : 'warn'}">${q} % de la meta</span>` : ''}</div>`;
  };
  return `<div class="tiles">${tile('Calorías', s.kcal, t.kcal, 'kcal')}${tile('Proteínas', s.p, t.P, 'g')}${tile('Carbohidratos', s.c, t.C, 'g')}${tile('Grasas', s.g, t.G, 'g')}</div>
    <p class="hint" style="margin-top:8px">Lo ideal es quedar entre 90 % y 110 % de la meta.</p>`;
}

function mealsHtml(plan) {
  const gs = db.groups.filter(g => plan.portions[g.id]);
  if (!gs.length) return '<p class="muted">Primero indica las porciones del día.</p>';
  return `<div class="tablewrap"><table class="mealgrid"><thead><tr><th>Grupo</th>${MEALS.map(([, l]) => `<th>${l.split(' / ')[0]}</th>`).join('')}<th>Repartidas</th></tr></thead><tbody>
    ${gs.map(g => `<tr><td>${esc(g.name)}</td>${MEALS.map(([m, l]) => `<td><input name="meals.${m}.${g.id}" inputmode="decimal" value="${String(plan.meals[m]?.[g.id] ?? '').replace('.', ',')}" style="width:56px;padding:6px;text-align:right" aria-label="${esc(g.name)}, ${l}"></td>`).join('')}<td data-assigned="${g.id}"></td></tr>`).join('')}
    <tr><th>kcal por comida</th>${MEALS.map(([m]) => `<td data-mealkcal="${m}"></td>`).join('')}<td></td></tr>
  </tbody></table></div>`;
}

function updatePlanUI(p, plan) {
  $('#planAlerts').innerHTML = alertsHtml(alertsFor(p, plan));
  $('#tgt').innerHTML = targetsHtml(p, plan);
  $('#tot').innerHTML = totalsHtml(p, plan);
  for (const g of db.groups) {
    const el = app.querySelector(`[data-assigned="${g.id}"]`); if (!el) continue;
    const got = MEALS.reduce((s, [m]) => s + (plan.meals[m]?.[g.id] || 0), 0), want = plan.portions[g.id] || 0;
    const over = got - want > .01;
    el.innerHTML = `<span class="chip ${over ? 'err' : Math.abs(got - want) < .01 ? '' : 'warn'}">${fmt(got)} de ${fmt(want)}${over ? ` · sobran ${fmt(got - want)}` : ''}</span>`;
  }
  for (const [m] of MEALS) { const el = app.querySelector(`[data-mealkcal="${m}"]`); if (el) el.textContent = fmt(totals(plan.meals[m]).kcal, 0); }
}

// ---------- enrutador ----------
function route() {
  const [, a, id, b, cid, sub] = (location.hash || '#/').slice(1).split('/');
  const p = a === 'p' ? patient(id) : null;
  const plan = p && b === 'pauta' && cid ? (p.plans || []).find(x => x.id === cid) : null;
  let html;
  if (a === 'nuevo') html = vPatientForm();
  else if (a === 'alimentos') html = vFoods();
  else if (a === 'respaldo') html = vBackup();
  else if (p && b === 'editar') html = vPatientForm(p);
  else if (p && b === 'control') html = vControl(p, cid ? p.controls.find(c => c.id === cid) : null);
  else if (p && b === 'informe') html = vReport(p);
  else if (plan && sub === 'ver') html = vPlanPrint(p, plan);
  else if (p && b === 'pauta') { ui.plan = plan ? structuredClone(plan) : newPlan(p); html = vPlan(p, ui.plan); }
  else if (p) html = vPatient(p);
  else html = vList();
  app.innerHTML = html;
  document.querySelectorAll('.tabs a').forEach(t => t.toggleAttribute('aria-current', t.dataset.tab === (a === 'alimentos' || a === 'respaldo' ? a : 'p')));
  if (p && b === 'control') { const f = $('#fControl'); const upd = () => $('#live').innerHTML = liveResults(p, readControl(f)); f.addEventListener('input', upd); upd(); }
  if ($('#fPlan')) initPlanForm(p);
  scrollTo(0, 0);
}
addEventListener('hashchange', route);

function initPlanForm(p) {
  const fp = $('#fPlan');
  $('#meals').innerHTML = mealsHtml(ui.plan); updatePlanUI(p, ui.plan);
  fp.addEventListener('input', e => {
      const [kind, meal, gid] = (e.target.name || '').split('.');
      if (kind === 'meals') {
        // no deja repartir más porciones de las que el grupo tiene en el día
        const want = num(fp.elements['portions.' + gid].value) || 0;
        const others = MEALS.reduce((s, [m]) => s + (m === meal ? 0 : num(fp.elements[`meals.${m}.${gid}`]?.value) || 0), 0);
        const max = Math.max(0, want - others), v = num(e.target.value) || 0;
        if (v > max + 1e-9) {
          e.target.value = max ? String(max).replace('.', ',') : '';
          toast(`Solo quedan ${fmt(max)} de ${fmt(want)} porciones de ${db.groups.find(g => g.id === gid).name.toLowerCase()}`);
          e.target.classList.remove('over'); void e.target.offsetWidth; e.target.classList.add('over');
        }
      }
      ui.plan = readPlan(fp, ui.plan);
      if (e.target.name?.startsWith('portions.')) $('#meals').innerHTML = mealsHtml(ui.plan); // los grupos del reparto siguen a las porciones
      if (e.target.name === 'units' || e.target.name === 'budget') { // el menú cambia de formato o de alimentos
        ui.plan.menu = buildMenu(ui.plan, p);
        for (const [m] of MEALS) fp.elements['menu.' + m].value = ui.plan.menu[m] || '';
        toast('Menú actualizado');
      }
      updatePlanUI(p, ui.plan);
  });
}

// ---------- acciones ----------
app.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { ui.q = t.value; const pos = t.selectionStart; route(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
  if (t.id === 'foodQ') { ui.foodQ = t.value; const pos = t.selectionStart; route(); const q = $('#foodQ'); q.focus(); q.setSelectionRange(pos, pos); }
  if (t.classList.contains('grams')) {
    const tr = t.closest('tr'), f = db.foods.find(x => x.id === tr.dataset.food), k = (num(t.value) || 0) / 100;
    for (const key of ['kcal', 'p', 'c', 'g']) tr.querySelector(`[data-k="${key}"]`).textContent = fmt(f[key] * k, key === 'kcal' ? 0 : 1);
  }
});
app.addEventListener('change', e => {
  if (e.target.id === 'metric') { ui.metric = e.target.value; const [, , id] = location.hash.slice(1).split('/'); $('#chart').innerHTML = chart(patient(id), ui.metric); }
  if (e.target.id === 'importFile') importBackup(e.target.files[0]);
});
app.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, [, , id, , cid] = location.hash.slice(1).split('/');
  if (f.id === 'fPatient') {
    const v = Object.fromEntries(new FormData(f));
    v.name = v.name.trim();
    if (!v.name) return toast('Escribe el nombre');
    v.cond = {};
    for (const k of Object.keys(v)) if (k.startsWith('cond.')) { v.cond[k.slice(5)] = true; delete v[k]; }
    let p = patient(id);
    if (p) Object.assign(p, v); else { p = { id: uid(), controls: [], created: today(), ...v }; db.patients.push(p); }
    if (save()) { toast('Paciente guardado'); location.hash = '#/p/' + p.id; }
  }
  if (f.id === 'fControl') {
    const p = patient(id), c = readControl(f);
    if (!c.date) return toast('Falta la fecha');
    if (!c.weight || !c.height) return toast('Faltan peso y talla');
    if (c.weight < 2 || c.weight > 400 || c.height < 40 || c.height > 250) return toast('Revisa peso (kg) y talla (cm)');
    const old = cid && p.controls.find(x => x.id === cid);
    if (old) Object.assign(old, c); else p.controls.push({ id: uid(), ...c });
    if (save()) { toast('Control guardado'); location.hash = '#/p/' + p.id; }
  }
  if (f.id === 'fPlan') {
    const p = patient(id), plan = readPlan(f, ui.plan);
    if (!plan.date) return toast('Falta la fecha');
    const over = db.groups.find(g => MEALS.reduce((s, [m]) => s + (plan.meals[m]?.[g.id] || 0), 0) - (plan.portions[g.id] || 0) > .01);
    if (over) return toast(`Hay más porciones de ${over.name.toLowerCase()} repartidas que en el día. Corrígelo en el paso 3.`);
    p.plans ||= [];
    const i = p.plans.findIndex(x => x.id === plan.id);
    if (i >= 0) p.plans[i] = plan; else p.plans.push(plan);
    p.plans.sort((x, y) => x.date.localeCompare(y.date));
    if (save()) { toast('Pauta guardada'); location.hash = `#/p/${p.id}/pauta/${plan.id}/ver`; }
  }
  if (f.id === 'fGroups') {
    const fd = new FormData(f);
    for (const g of db.groups) {
      for (const k of ['kcal', 'p', 'c', 'g']) { const n = num(fd.get(`${g.id}.${k}`)); if (n != null) g[k] = n; }
      g.ex = fd.get(`${g.id}.ex`).trim();
      g.exBudget = fd.get(`${g.id}.exBudget`).trim();
    }
    if (save()) toast('Grupos guardados');
  }
  if (f.id === 'fFood') {
    const v = Object.fromEntries(new FormData(f));
    const food = { name: v.name.trim(), kcal: num(v.kcal), p: num(v.p) || 0, c: num(v.c) || 0, g: num(v.g) || 0 };
    if (!food.name || food.kcal == null) return toast('Falta nombre o kcal');
    const old = db.foods.find(x => x.id === v.id);
    if (old) Object.assign(old, food); else db.foods.push({ id: uid(), ...food });
    if (save()) { toast('Alimento guardado'); route(); }
  }
});
app.addEventListener('click', e => {
  const a = e.target.closest('[data-action]')?.dataset.action;
  if (!a) return;
  const [, , id, , cid] = location.hash.slice(1).split('/');
  if (a === 'delControl' && confirm('¿Eliminar este control? No se puede deshacer.')) {
    const p = patient(id); p.controls = p.controls.filter(c => c.id !== cid);
    if (save()) { toast('Control eliminado'); location.hash = '#/p/' + id; }
  }
  if (a === 'delPlan' && confirm('¿Eliminar esta pauta? No se puede deshacer.')) {
    const p = patient(id); p.plans = (p.plans || []).filter(x => x.id !== cid);
    if (save()) { toast('Pauta eliminada'); location.hash = '#/p/' + id; }
  }
  if (a === 'print') print();
  if (a === 'printAll') { document.body.classList.add('with-report'); addEventListener('afterprint', () => document.body.classList.remove('with-report'), { once: true }); print(); }
  if (a === 'suggest' || a === 'remenu') {
    const p = patient(id), f = $('#fPlan');
    ui.plan = readPlan(f, ui.plan);
    if (a === 'remenu') { ui.plan.menu = buildMenu(ui.plan, p); toast('Menú rehecho desde el reparto'); }
    else {
      const budget = e.target.closest('[data-budget]').dataset.budget === '1';
      const s = suggestPlan(p, ui.plan, budget);
      if (!s) return toast('Falta la fecha de nacimiento o un control con peso y talla');
      if (Object.keys(ui.plan.portions).length && !confirm('Esto reemplaza la meta, las porciones, el reparto, el menú y las indicaciones de preferir/evitar. ¿Seguir?')) return;
      ui.plan = s; toast(budget ? 'Pauta económica sugerida' : 'Pauta regular sugerida');
    }
    const y = scrollY; app.innerHTML = vPlan(p, ui.plan); initPlanForm(p); scrollTo(0, y);
  }
  if (a === 'export') exportBackup();
  if (a === 'editFood') {
    const f = db.foods.find(x => x.id === e.target.closest('tr').dataset.food), form = $('#fFood');
    for (const k of ['id', 'name', 'kcal', 'p', 'c', 'g']) form.elements[k].value = f[k];
    $('#foodTitle').textContent = 'Editar alimento'; form.querySelector('[data-action="delFood"]').hidden = false;
    form.scrollIntoView({ behavior: 'smooth' }); form.elements.name.focus({ preventScroll: true });
  }
  if (a === 'resetFood') { $('#foodTitle').textContent = 'Agregar alimento'; $('#fFood [data-action="delFood"]').hidden = true; }
  if (a === 'delFood') {
    const fid = $('#fFood').elements.id.value;
    if (confirm('¿Eliminar este alimento?')) { db.foods = db.foods.filter(x => x.id !== fid); if (save()) { toast('Alimento eliminado'); route(); } }
  }
});
// eliminar paciente: desde editar, para que no quede a un toque de distancia en la ficha
app.addEventListener('click', e => {
  if (!e.target.matches('[data-action="delPatient"]')) return;
  const [, , id] = location.hash.slice(1).split('/'), p = patient(id);
  if (confirm(`¿Eliminar a ${p.name} y todos sus controles? No se puede deshacer.`)) {
    db.patients = db.patients.filter(x => x.id !== id); if (save()) { toast('Paciente eliminado'); location.hash = '#/'; }
  }
});

function exportBackup() {
  const blob = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `respaldo-consulta-${today()}.json` });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  db.lastBackup = Date.now(); save(); route(); toast('Respaldo descargado');
}
async function importBackup(file) {
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.patients) || !Array.isArray(d.foods)) throw 0;
    if (!confirm(`El respaldo tiene ${d.patients.length} pacientes. ¿Reemplazar los datos de este equipo?`)) return;
    db = migrate(d); if (save()) { toast('Respaldo cargado'); location.hash = '#/'; route(); }
  } catch { alert('Ese archivo no es un respaldo válido de Consulta.'); }
}

route();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
</script>
